name: Release

# Push a tag like v1.7.0 → a GitHub release with privento.zip attached.
# Installed sites pick the release up through the plugin's own updater.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Tag must match the plugin version
        run: |
          version=$(sed -n "s/^define( 'PRIVENTO_VERSION', *'\([^']*\)' );.*/\1/p" privento.php)
          header=$(sed -n 's/^ \* Version: *//p' privento.php)
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt)
          echo "tag=$GITHUB_REF_NAME constant=$version header=$header stable=$stable"
          test -n "$version"
          test "v$version" = "$GITHUB_REF_NAME"
          test "$version" = "$header"
          test "$version" = "$stable"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Syntax check and tests
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/run.php

      - name: Build privento.zip
        # export-ignore in .gitattributes keeps development files out.
        run: git archive --format=zip --prefix=privento/ -o privento.zip "$GITHUB_SHA"

      - name: Release notes from readme.txt
        run: |
          awk -v v="= $VERSION =" '$0 == v && !seen {on=1; seen=1; next} /^=/ {on=0} on' readme.txt > notes.md
          test -s notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" privento.zip --title "Privento $VERSION" --notes-file notes.md
